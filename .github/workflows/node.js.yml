# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ['master']
  pull_request:
  merge_group:

jobs:
  # This job runs all the primary checks: linting, formatting, type checking, and unit tests.
  # It is the equivalent of the old `build`, `test`, `lint`, and `format` jobs combined.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # lets the flakiness.io reporter upload test results via GitHub OIDC
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: npm ci
      - run: mise run check
        env:
          FLAKINESS_PROJECT: frogpond/ccc-server

  smoke-test-stolaf:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - run: echo "Smoke tests temporarily disabled - skipping"

  smoke-test-carleton:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - run: echo "Smoke tests temporarily disabled - skipping"

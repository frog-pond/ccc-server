# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: ['master']
  pull_request:
  merge_group:

jobs:
  # This job runs all the primary checks: linting, formatting, type checking, and unit tests.
  # It is the equivalent of the old `build`, `test`, `lint`, and `format` jobs combined.
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # lets the flakiness.io reporter upload test results via GitHub OIDC
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      - run: npm ci
      - run: mise run check
        env:
          FLAKINESS_PROJECT: frogpond/ccc-server

  # The Cloudflare Workers / Durable Objects code in workers/ is an npm
  # workspace of the root package, so it can import from source/, and runs its
  # tests inside workerd.
  workers:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # lets the flakiness.io reporter upload test results via GitHub OIDC
      id-token: write
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # npm 10's resolver crashes on vitest's peer dependencies; npm 12 does not
      - run: npm install --global npm@12.2.0
      # one install at the root covers both packages
      - run: npm ci
        working-directory: .
      - run: npm run typecheck
      # bundles the worker the way a deploy would, without deploying it
      - run: npm run build
      - run: npm test
        env:
          FLAKINESS_PROJECT: frogpond/ccc-server

  # Cloudflare Workers Builds installs and builds from workers/, where npm
  # installs only that workspace's dependencies. A package the worker imports
  # from source/ but does not declare in workers/package.json then fails to
  # resolve there, which the job above cannot see: it installs from the root, so
  # every package is present. This installs and builds the way Cloudflare does,
  # with the npm that ships with node (as Cloudflare's build uses).
  workers-standalone-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup mise
        uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1
      # from workers/, not the root: only this workspace's dependencies come
      - run: npm ci
      - run: npm run build

  smoke-test-stolaf:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - run: echo "Smoke tests temporarily disabled - skipping"

  smoke-test-carleton:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - run: echo "Smoke tests temporarily disabled - skipping"

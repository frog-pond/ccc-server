[tools]
node = "24.15.0"

[tasks.p]
run = "mise run pretty -- --no-write --check"
alias = "pretty:check"

[tasks.pretty]
run = "prettier --write source scripts test"
env = { _.path = ['{{config_root}}/node_modules/.bin'] }

[tasks.format]
run = { task = "pretty" }

[tasks.lint]
run = "eslint --cache --max-warnings=0 ."
env = { _.path = ['{{config_root}}/node_modules/.bin'] }

[tasks."stolaf-college"]
run = "wrangler dev --env stolaf-college --persist-to .wrangler/state/stolaf-college"
env = { _.path = ['{{config_root}}/node_modules/.bin'] }

[tasks."stolaf-college:mdns"]
run = "node scripts/dev-mdns.ts stolaf-college"

[tasks."carleton-college"]
run = "wrangler dev --env carleton-college --persist-to .wrangler/state/carleton-college"
env = { _.path = ['{{config_root}}/node_modules/.bin'] }

[tasks."carleton-college:mdns"]
run = "node scripts/dev-mdns.ts carleton-college"

[tasks."test:live:stolaf-college"]
run = "./scripts/smoke-test.sh stolaf-college"

[tasks."test:live:carleton-college"]
run = "./scripts/smoke-test.sh carleton-college"

[tasks.test]
run = "node --test 'source/**/*.test.ts' 'test/**/*.test.ts' 'scripts/**/*.test.ts'"

[tasks.build]
run = "tsc --build ."
env = { _.path = ['{{config_root}}/node_modules/.bin'] }

[tasks."build:watch"]
run = "tsc --build --watch ."
env = { _.path = ['{{config_root}}/node_modules/.bin'] }

[tasks.typecheck]
run = "tsc --build ."
env = { _.path = ['{{config_root}}/node_modules/.bin'] }

[tasks."typecheck:watch"]
run = "mise run typecheck --watch"

[tasks.check]
run = { tasks = ["p", "lint", "test", "typecheck"] }

[tasks."fixtures:record"]
run = "node scripts/record-fixtures.ts"
